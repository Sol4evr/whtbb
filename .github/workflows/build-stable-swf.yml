name: Build stable WHTBB SWF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-stable-swf.yml'

permissions:
  contents: write

jobs:
  build-stable-swf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download preserved source SWF
        run: |
          set -euo pipefail
          mkdir -p games/whtbb .build/ffdec .build/as3
          curl --fail --location --silent --show-error \
            https://archive.org/download/whtbb/brain_game_2_6_7_translated_v1.swf \
            -o games/whtbb/brain_game_2_6_7_translated_v1.swf
          echo 'a2bc047379274cc0f1556749c326b47d971849aa4a87c70a88da80aca448af96  games/whtbb/brain_game_2_6_7_translated_v1.swf' | sha256sum -c -

      - name: Download pinned FFDec
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip \
            -o .build/ffdec.zip
          unzip -q .build/ffdec.zip -d .build/ffdec
          test -f .build/ffdec/ffdec.jar || FFDEC_JAR="$(find .build/ffdec -name ffdec.jar -print -quit)"
          test -n "${FFDEC_JAR:-.build/ffdec/ffdec.jar}"

      - name: Export and patch SummaryScreen
        run: |
          set -euo pipefail
          FFDEC_JAR="$(find .build/ffdec -name ffdec.jar -print -quit)"
          java -jar "$FFDEC_JAR" -config showMethodBodyId=true -export script .build/as3 games/whtbb/brain_game_2_6_7_translated_v1.swf >/dev/null
          SUMMARY="$(find .build/as3 -type f -iname 'SummaryScreen.as' -print -quit)"
          test -n "$SUMMARY"
          python3 - "$SUMMARY" .build/SummaryScreen-stable.as <<'PY'
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          text = open(src, encoding='utf-8', errors='replace').read()
          anchor = 'GameWorld.totalScores = combinedScore;'
          bridge = '''\n         // Preservation bridge: expose already-computed protected values atomically.\n         // This changes no gameplay or scoring logic.\n         trace("WHTBB_SCORES=" + combinedScore + "," + GameWorld.protectedValues.getValue(GameWorld.PROTECTED_VALUE_CATEGORY_SCORE_1) + "," + GameWorld.protectedValues.getValue(GameWorld.PROTECTED_VALUE_CATEGORY_SCORE_2) + "," + GameWorld.protectedValues.getValue(GameWorld.PROTECTED_VALUE_CATEGORY_SCORE_3) + "," + GameWorld.protectedValues.getValue(GameWorld.PROTECTED_VALUE_CATEGORY_SCORE_4));\n'''
          if anchor not in text:
              raise SystemExit('combinedScore anchor missing')
          open(dst, 'w', encoding='utf-8').write(text.replace(anchor, anchor + bridge, 1))
          PY

      - name: Create and verify stable SWF
        run: |
          set -euo pipefail
          FFDEC_JAR="$(find .build/ffdec -name ffdec.jar -print -quit)"
          OUT=games/whtbb/brain_game_2_6_7_translated_v1_stable.swf
          rm -f "$OUT"
          java -jar "$FFDEC_JAR" -replace \
            games/whtbb/brain_game_2_6_7_translated_v1.swf "$OUT" \
            com.playfish.games.whohasthebiggestbrain.SummaryScreen \
            .build/SummaryScreen-stable.as
          test -s "$OUT"
          rm -rf .build/verify
          mkdir -p .build/verify
          java -jar "$FFDEC_JAR" -export script .build/verify "$OUT" >/dev/null
          grep -Rqs 'WHTBB_SCORES=' .build/verify
          sha256sum "$OUT" > games/whtbb/brain_game_2_6_7_translated_v1_stable.swf.sha256

      - name: Commit stable artifact if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/whtbb/brain_game_2_6_7_translated_v1_stable.swf games/whtbb/brain_game_2_6_7_translated_v1_stable.swf.sha256
          if git diff --cached --quiet; then
            echo 'Stable SWF unchanged.'
          else
            git commit -m 'build: add verified stable score-capture SWF'
            git push
          fi
